[project]
name = "textie-backend"
version = "0.1.0"
description = "Backend for texting application."
authors = [
    {name = "prawinsanjai",email = "prawinpk10@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "websockets (>=16.1,<17.0)",
    "fastapi (>=0.139.0,<0.140.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
